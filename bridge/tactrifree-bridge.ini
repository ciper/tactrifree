; TactriFree EcuFlash bridge settings (this file sits next to glu32.dll in EcuFlash's folder; every key is optional)
[bridge]
; Firmware version EcuFlash is shown (its updater only runs when the cable looks older than what it ships).
; The bridge log always records the cable's REAL version.
FirmwareVersion=1.17.4869
; 1 = never let firmware update / bootloader erase+program commands reach the cable (atx, atfw, tbp, tbw, tbe, ...).
; Set 0 only for a genuine Tactrix firmware update you want to allow.
BlockFirmware=1
; 1 = EcuFlash gets no internet access: its start-up version check (www.openecu.org) and ROM upload (ftp.tactrix.com)
; fail quietly. Flashing, reading and logging never use the internet. Set 0 to allow them.
BlockInternet=1
; 1 = the bridge log also shows what EcuFlash sends and what the cable answers (summarized and rate-limited,
; useful when reporting a problem). Set 0 to log events only.
LogTraffic=1
